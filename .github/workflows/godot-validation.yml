name: Godot validation and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Cache Android SDK and Godot export templates
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/android-sdk
            ~/.android
            ~/.local/share/godot/export_templates/4.3.stable
          key: shadowronin-godot-4.3-android33-${{ runner.os }}-v1
      - name: Configure Android export toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v curl >/dev/null 2>&1 || ! command -v unzip >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends curl unzip
          fi
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          java -version
          yes | sdkmanager --licenses
          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            sdkmanager "platform-tools"
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-33" ]; then
            sdkmanager "platforms;android-33"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/33.0.2" ]; then
            sdkmanager "build-tools;33.0.2"
          fi

          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ ! -s "$TEMPLATE_DIR/android_debug.apk" ] || [ ! -s "$TEMPLATE_DIR/android_release.apk" ]; then
            mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
            curl -fsSL -o /tmp/godot-templates.tpz \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Boot main scene headlessly
        run: godot --headless --path . --quit-after 120

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ShadowRonin-debug.apk

      - name: Verify APK
        run: |
          test -s build/ShadowRonin-debug.apk
          file build/ShadowRonin-debug.apk
          ls -lh build/ShadowRonin-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowRonin-Android-debug
          path: build/ShadowRonin-debug.apk
          if-no-files-found: error
          retention-days: 14
